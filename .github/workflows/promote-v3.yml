name: Promote V3 to production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-v3.yml'

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      DEPLOYMENT_URL: taiwan-live-traffic-5x3wjhsyo-similaitws-projects.vercel.app
      VERCEL_SCOPE: similaitws-projects
    steps:
      - name: Check Vercel token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN GitHub secret is not configured."
            exit 1
          fi

      - name: Promote verified V3 preview
        run: npx --yes vercel@latest promote "$DEPLOYMENT_URL" --yes --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"
