name: One-shot dependency security update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dependency-security-update.yml'

permissions:
  contents: write

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install patched dependencies and rebuild lockfile
        run: npm install next@^16.3.3 fast-xml-parser@^5.10.1

      - name: Report dependency audit
        shell: bash
        run: |
          npm audit --json > npm-audit-after.json || true
          node - <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('npm-audit-after.json', 'utf8'));
          console.log('AUDIT_AFTER=' + JSON.stringify(audit.metadata?.vulnerabilities ?? {}));
          NODE

      - name: Production build
        run: npm run build

      - name: Commit package manifest and lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "chore: upgrade security-sensitive dependencies"
          git push origin HEAD:main
