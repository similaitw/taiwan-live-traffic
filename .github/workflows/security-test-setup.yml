name: One-shot security test setup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/security-test-setup.yml'

permissions:
  contents: write

jobs:
  setup-security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install TypeScript test runner
        run: |
          npm install --save-dev tsx
          npm pkg set 'scripts.test:security=tsx --test tests/camera-proxy-security.test.ts'

      - name: Run security regression tests
        run: npm run test:security

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Production build
        run: npm run build

      - name: Commit package manifest and lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No package changes to commit."
            exit 0
          fi
          git commit -m "test: add TypeScript security test runner"
          git push origin HEAD:main
