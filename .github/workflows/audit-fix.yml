name: One-shot npm audit fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-fix.yml'

permissions:
  contents: write

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply non-breaking audit fixes
        run: npm audit fix

      - name: Report audit result
        shell: bash
        run: |
          npm audit --json > npm-audit-after.json || true
          node - <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('npm-audit-after.json', 'utf8'));
          console.log('AUDIT_AFTER=' + JSON.stringify(audit.metadata?.vulnerabilities ?? {}));
          NODE

      - name: Security regression tests
        run: npm run test:security

      - name: Production build
        run: npm run build

      - name: Commit dependency fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "chore: apply non-breaking npm audit fixes"
          git push origin HEAD:main
