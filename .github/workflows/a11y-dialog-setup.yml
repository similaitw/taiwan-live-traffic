name: One-shot accessibility dialog semantics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/a11y-dialog-setup.yml'

permissions:
  contents: write

jobs:
  apply-dialog-semantics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Apply dialog semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('components/CameraModal.tsx')
          text = path.read_text()

          old = '''      <div
        className="overflow-hidden w-full max-w-3xl transition-all duration-300"
        style={{'''
          new = '''      <div
        role="dialog"
        aria-modal="true"
        aria-labelledby="camera-modal-title"
        className="overflow-hidden w-full max-w-3xl transition-all duration-300"
        style={{'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one modal container match, found {text.count(old)}')
          text = text.replace(old, new)

          old_title = '''            <h2 className="text-sm font-bold truncate" style={{ color: 'var(--text-primary)' }}>{camera.name}</h2>'''
          new_title = '''            <h2 id="camera-modal-title" className="text-sm font-bold truncate" style={{ color: 'var(--text-primary)' }}>{camera.name}</h2>'''
          if text.count(old_title) != 1:
              raise SystemExit(f'expected one modal title match, found {text.count(old_title)}')
          text = text.replace(old_title, new_title)
          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Regression tests
        run: npm run test:security

      - name: Production build
        run: npm run build

      - name: Validate diff
        run: git diff --check

      - name: Commit dialog semantics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/CameraModal.tsx
          git commit -m "a11y: add camera modal dialog semantics"
          git push origin HEAD:main
